<!doctype html><html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; background: #5e3a26; }
  .wrap { position: relative; width: 440px; height: 280px;
          background: radial-gradient(500px 320px at 30% 0%, #6d4630 0%, #5e3a26 60%, #4a2d1d 100%); }
  /* the product's own motif: a selection around the cup, no words */
  .sel { position: absolute; left: 118px; top: 36px; width: 204px; height: 208px; border: 3px dashed rgba(255,255,255,.75); border-radius: 10px; }
  .sel i { position: absolute; width: 14px; height: 14px; background: #fff; border-radius: 3px; }
  .sel i:nth-child(1) { left: -8px; top: -8px; } .sel i:nth-child(2) { right: -8px; top: -8px; }
  .sel i:nth-child(3) { left: -8px; bottom: -8px; } .sel i:nth-child(4) { right: -8px; bottom: -8px; }
  img { position: absolute; left: 150px; top: 68px; width: 140px; height: 140px; }
</style></head>
<body><div class="wrap">
  <div class="sel"><i></i><i></i><i></i><i></i></div>
  <img src="cup-white.png" alt="">
</div></body></html>
