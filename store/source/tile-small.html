<!doctype html><html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; background: #e3f6f3; }
  .wrap { position: relative; width: 440px; height: 280px;
          background: radial-gradient(500px 320px at 30% 0%, #bdf1ea 0%, #e3f6f3 55%, #fde2c6 100%); }
  /* the product's own motif: a selection around the icon, no words of its own */
  .sel { position: absolute; left: 118px; top: 36px; width: 204px; height: 208px; border: 3px dashed rgba(32,57,88,.6); border-radius: 10px; }
  .sel i { position: absolute; width: 14px; height: 14px; background: #203958; border-radius: 3px; }
  .sel i:nth-child(1) { left: -8px; top: -8px; } .sel i:nth-child(2) { right: -8px; top: -8px; }
  .sel i:nth-child(3) { left: -8px; bottom: -8px; } .sel i:nth-child(4) { right: -8px; bottom: -8px; }
  img { position: absolute; left: 146px; top: 66px; width: 148px; height: 148px; }
</style></head>
<body><div class="wrap">
  <div class="sel"><i></i><i></i><i></i><i></i></div>
  <img src="sticker.png" alt="">
</div></body></html>
