<!doctype html><html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; background: #5e3a26; color: #fff;
               font-family: "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { position: relative; width: 1400px; height: 560px;
          background: radial-gradient(1300px 600px at 15% 0%, #6d4630 0%, #5e3a26 55%, #4a2d1d 100%); }
  .icon { position: absolute; left: 84px; top: 128px; width: 132px; height: 132px; }
  h1 { position: absolute; left: 240px; top: 118px; margin: 0; font-size: 84px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  p { position: absolute; left: 244px; top: 232px; margin: 0; font-size: 27px; line-height: 1.4; color: rgba(255,255,255,.82); max-width: 520px; }
  .shot { position: absolute; left: 830px; top: 64px; width: 760px; border-radius: 14px; overflow: hidden; background: #fff;
          border: 1px solid rgba(255,255,255,.16); box-shadow: 0 30px 70px rgba(0,0,0,.5); }
  .shot img { display: block; width: 100%; }
</style></head>
<body><div class="wrap">
  <img class="icon" src="tile-icon.png" alt="">
  <h1>CoffeeShot</h1>
  <p>Screenshot the visible tab, an area, or the whole page. Mark it up. Copy or save. Nothing leaves your browser.</p>
  <div class="shot"><img src="shot-picker.png" alt=""></div>
</div></body></html>
