<!doctype html><html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; background: #e3f6f3; color: #203958;
               font-family: "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { position: relative; width: 1400px; height: 560px;
          background: radial-gradient(1300px 600px at 15% 0%, #bdf1ea 0%, #e3f6f3 50%, #fde2c6 100%); }
  .icon { position: absolute; left: 76px; top: 118px; width: 150px; height: 150px; }
  h1 { position: absolute; left: 254px; top: 118px; margin: 0; font-size: 84px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  p { position: absolute; left: 258px; top: 232px; margin: 0; font-size: 27px; line-height: 1.4; color: rgba(32,57,88,.8); max-width: 520px; }
  .shot { position: absolute; left: 830px; top: 64px; width: 760px; border-radius: 14px; overflow: hidden; background: #fff;
          border: 1px solid rgba(32,57,88,.18); box-shadow: 0 30px 70px rgba(32,57,88,.28); }
  .shot img { display: block; width: 100%; }
</style></head>
<body><div class="wrap">
  <img class="icon" src="sticker.png" alt="">
  <h1>CoffeeShot</h1>
  <p>Screenshot the visible tab, an area, or the whole page. Mark it up. Copy or save. Nothing leaves your browser.</p>
  <div class="shot"><img src="work/shot-picker.png" alt=""></div>
</div></body></html>
