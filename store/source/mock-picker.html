<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="work/picker.css">
<style>
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: #fff; }
  /* the frozen snapshot the picker draws under itself */
  img.snap { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }
  /* entrance animations have finished by the time anyone sees this state */
  .host, .host * { animation: none !important; }
</style>
</head>
<body>
<img class="snap" src="work/page.png" alt="">
<div class="host">
  <div class="masks">
    <div style="height:235px"></div>
    <div style="top:700px;height:100px"></div>
    <div style="left:0;top:235px;width:250px;height:465px"></div>
    <div style="left:1020px;top:235px;width:260px;height:465px"></div>
  </div>
  <div class="sel" style="left:250px;top:235px;width:770px;height:465px"></div>
  <div class="size" style="left:250px;top:211px">770 × 465</div>
  <div class="bar" style="right:260px;top:708px">
    <button class="primary">Copy <kbd>C</kbd></button><button>Save <kbd>S</kbd></button><button>Edit <kbd>E</kbd></button>
  </div>
</div>
</body>
</html>
