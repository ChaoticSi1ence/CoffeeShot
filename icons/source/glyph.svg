<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The toolbar glyph: the mug from the icon, with the camera cut out of
       it, in one colour. White, because toolbars are dark more often than
       not and the coloured version was hard to see. -->
  <defs>
    <mask id="camera">
      <rect width="128" height="128" fill="#fff"/>
      <rect x="31" y="62" width="48" height="36" rx="7" fill="#000"/>
      <rect x="46" y="55" width="18" height="12" rx="3" fill="#000"/>
    </mask>
  </defs>
  <path d="M60 8c-10 8 10 14 0 24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <circle cx="93" cy="80" r="15" fill="none" stroke="#fff" stroke-width="9"/>
  <rect x="16" y="40" width="72" height="72" rx="12" fill="#fff" mask="url(#camera)"/>
  <circle cx="55" cy="80" r="9" fill="none" stroke="#fff" stroke-width="5"/>
  <circle cx="72" cy="70" r="2.5" fill="#fff"/>
</svg>
